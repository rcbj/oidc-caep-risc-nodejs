# Runs the library's test suite and build, then builds the demo app's container and checks what it serves.
#
#   test    `npm test` (node:test against the stub provider, the stub transmitter, and the setup
#           script's plan), the TypeScript build (strict), and the check that the committed
#           package.json versions follow VERSION.
#   demo    builds the image, starts it with a client secret and an offline metadata document, waits
#           for its health check, and checks the sign-in page and the /login redirect.
#
# Nothing is pushed. Publishing the library is npm-publish.yml's job.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Library tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.22.1, the 21 October 2026 security release fixing HTTP2Shell / Node2Shell (CVE-2026-111497),
        # the Dockerfile's; 22.18 is the oldest that runs the TypeScript sources as they are.
        node: ['22.18.0', '24.22.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the manifests follow VERSION
        run: node scripts/version.mjs --check-manifests

  demo:
    name: Demo container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci

      - name: Make the demo's generated files
        run: |
          set -euo pipefail
          mkdir -p demo/generated
          printf '%s\n' 'ci-client-secret' > demo/generated/client-secret
          cat > demo/generated/idp-metadata.json <<'EOF'
          {
            "issuer": "https://idp.test",
            "authorization_endpoint": "https://idp.test/authorize",
            "token_endpoint": "https://idp.test/token",
            "jwks_uri": "https://idp.test/jwks",
            "response_types_supported": ["code"],
            "subject_types_supported": ["public"],
            "id_token_signing_alg_values_supported": ["RS256"],
            "token_endpoint_auth_methods_supported": ["client_secret_basic"],
            "code_challenge_methods_supported": ["S256"],
            "authorization_response_iss_parameter_supported": true
          }
          EOF
          chmod a+r demo/generated/*

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: oidc-caep-risc-nodejs-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name oidc-demo --network host \
            -e OIDC_METADATA_FILE=/app/demo/generated/idp-metadata.json \
            -v "$PWD/demo/generated:/app/demo/generated:ro" \
            oidc-caep-risc-nodejs-demo:ci
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' oidc-demo)"
            [ "$status" = healthy ] && { echo "healthy after ${i}s"; exit 0; }
            [ "$(docker inspect -f '{{.State.Running}}' oidc-demo)" = true ] || break
            sleep 1
          done
          docker logs oidc-demo >&2
          exit 1

      - name: Smoke-test what it serves
        run: |
          set -euo pipefail
          BASE=http://localhost:3000
          fail() { echo "FAIL: $*" >&2; exit 1; }
          curl -sf "$BASE/healthz" | grep -q '^ok$' || fail "healthz"
          curl -s -D /tmp/h -o /tmp/page.html "$BASE/"
          header() { grep -i "^$1:" /tmp/h | head -1 | cut -d' ' -f2- | tr -d '\r'; }
          csp="$(header Content-Security-Policy)"
          echo "$csp" | grep -q "default-src 'none'" || fail "CSP lacks default-src 'none'"
          echo "$csp" | grep -q "frame-ancestors 'none'" || fail "CSP lacks frame-ancestors 'none'"
          [ "$(header X-Frame-Options)" = DENY ] || fail "X-Frame-Options is not DENY"
          grep -q 'Sign in with OpenID Connect' /tmp/page.html || fail "the home page is not the sign-in page"
          loc="$(curl -s -D - -o /dev/null "$BASE/login" | grep -i '^location:' | cut -d' ' -f2 | tr -d '\r')"
          echo "$loc" | grep -q 'response_type=code' || fail "/login did not send response_type=code: $loc"
          echo "$loc" | grep -q 'code_challenge=' || fail "/login did not send a PKCE challenge: $loc"
          echo "$loc" | grep -q 'code_challenge_method=S256' || fail "/login did not send S256: $loc"
          curl -s -D - -o /dev/null "$BASE/login" | grep -qi '^set-cookie: oidc_txn=.*SameSite=Lax' || fail "no transaction cookie"
          echo "Smoke test passed."

      - name: Container logs
        if: always()
        run: docker logs oidc-demo 2>&1 | tail -50 || true
